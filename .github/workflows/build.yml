name: Build VZPatch APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Show Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        ls "$ANDROID_HOME" 2>/dev/null || echo "ANDROID_HOME not set"
        ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "no platforms dir"

    - name: Build VZPatch
      run: ./gradlew buildAll --no-daemon

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vzpatch-outputs
        path: |
          jar/build/outputs/
          manager/build/outputs/
          **/build/outputs/apk/**/*.apk
          **/build/libs/*.jar
